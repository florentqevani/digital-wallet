syntax = "proto3";
package user;

service UserService {
  rpc ListUsers    (ListUsersRequest)    returns (ListUsersResponse);
  rpc RegisterUser (RegisterUserRequest) returns (SimpleResponse);
  rpc UpdateUser   (UpdateUserRequest)   returns (SimpleResponse);
  rpc DeleteUser   (DeleteUserRequest)   returns (SimpleResponse);
  rpc ListClients  (ListClientsRequest)  returns (ListClientsResponse);
  rpc UpdateClient (UpdateClientRequest) returns (SimpleResponse);
  rpc DeleteClient (DeleteClientRequest) returns (SimpleResponse);
  rpc SetCurrency      (SetCurrencyRequest)      returns (SimpleResponse);
  rpc SetBalance       (SetBalanceRequest)       returns (SimpleResponse);
  rpc AddBalance       (AddBalanceRequest)       returns (AddBalanceResponse);
  rpc GetClientBalance (GetClientBalanceRequest) returns (GetClientBalanceResponse);

  //account management
  rpc ListAccounts  (ListAccountsRequest)  returns (ListAccountsResponse);
  rpc CreateAccount (CreateAccountRequest) returns (CreateAccountResponse);
  rpc DeleteAccount (DeleteAccountRequest) returns (SimpleResponse);
  rpc UpdateAccountStatus (UpdateAccountStatusRequest) returns (UpdateAccountStatusResponse);
}

message ListUsersRequest {}

message User {
  string id         = 1;
  string email      = 2;
  string name       = 3;
  string role       = 4;
  int64  created_at = 5;
}

message ListUsersResponse {
  repeated User users = 1;
}

message RegisterUserRequest {
  string email      = 1;
  string password   = 2;
  string name       = 3;
  string role       = 4;
  string created_by = 5;
}

message SimpleResponse {
  bool   success = 1;
  string message = 2;
}

message UpdateUserRequest {
  string id         = 1;
  string email      = 2;
  string name       = 3;
  string role       = 4;
  string password   = 5;
  string updated_by = 6;
}

message DeleteUserRequest {
  string id         = 1;
  string deleted_by = 2;
}

message ListClientsRequest {}

message ClientEntry {
  string id         = 1;
  string email      = 2;
  string name       = 3;
  int64  created_at = 4;
  string account_id = 5;
  string currency   = 6;
  double balance    = 7;
}

message ListClientsResponse {
  repeated ClientEntry clients = 1;
}

message UpdateClientRequest {
  string id               = 1;
  string email            = 2;
  string name             = 3;
  string password         = 4;
  string updated_by       = 5;
  string updated_by_role  = 6;  // 'user' | 'superadmin' — the backoffice role of the caller
}

message DeleteClientRequest {
  string id               = 1;
  string deleted_by       = 2;
  string deleted_by_role  = 3;  // 'user' | 'superadmin' — the backoffice role of the caller
}

message SetCurrencyRequest {
  string client_id = 1;
  string currency  = 2;
}

message SetBalanceRequest {
  string client_id = 1;
  double balance   = 2;
}

message AddBalanceRequest {
  string client_id = 1;
  double amount    = 2;
}

message AddBalanceResponse {
  bool   success = 1;
  string message = 2;
  double balance = 3;
}

message GetClientBalanceRequest {
  string client_id = 1;
}

message GetClientBalanceResponse {
  double balance  = 1;
  string currency = 2;
}

message Account {
  string id        = 1;
  string client_id = 2;
  string currency   = 3;
  double balance    = 4;
  string status    = 5; // 'active' | 'suspended' 
  int64  created_at = 6;
  int64  updated_at = 7;
}
message ListAccountsRequest {
  string client_id = 1;
}

message ListAccountsResponse {
  repeated Account accounts = 1;
  int32 total = 2;
}

message CreateAccountRequest {
  string client_id = 1;
  string currency  = 2;
}

message CreateAccountResponse {
  bool success = 1;
  string account_id = 2;
  string message = 3;
}

message DeleteAccountRequest {
  string account_id = 1;
}

message UpdateAccountStatusRequest {
  string account_id = 1;
  string status     = 2; // 'active' | 'suspended'
}

message UpdateAccountStatusResponse {
  bool success = 1;
  string message = 2;
}

